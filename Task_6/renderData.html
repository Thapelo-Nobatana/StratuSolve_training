<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>render Count</title>
    </head>
    <body>
        
        <h1>Amount of Times This <strong id="name"></strong> has been called</h1>
          <div id="Count">
          times: 
          </div>
          <p id="Age">Age:</p>

        <script>
            const strong = document.getElementById('name');
            const div = document.getElementById('Count');
            const p = document.getElementById('Age');
            const endpoint = 'name=test';


            async function fetchData() {
                const response = await fetch(`https://api.agify.io?${endpoint}`)

                const data = await response.json()
                 
                strong.innerHTML = `(${data.name})`
                 div.innerHTML = `Count: ${data.count}`
                 p.innerHTML = `Age: ${data.age}`
                
            }
            fetchData()
        </script>
    </body>
</html>
